<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.75)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.50)"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.85)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.60)"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.92)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.70)"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,1.0)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.80)"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Decorative blobs -->
  <circle cx="350" cy="30" r="90" fill="rgba(255,255,255,0.08)"/>
  <circle cx="30" cy="270" r="80" fill="rgba(255,255,255,0.06)"/>

  <!-- Chart base area -->
  <!-- Y axis -->
  <line x1="80" y1="40" x2="80" y2="238" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <!-- X axis -->
  <line x1="80" y1="238" x2="340" y2="238" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <!-- Grid lines -->
  <line x1="80" y1="188" x2="340" y2="188" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="80" y1="138" x2="340" y2="138" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="80" y1="88" x2="340" y2="88" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Bars (bottom = y:238) -->
  <!-- Bar 1: Q1, height=65 -->
  <rect x="100" y="173" width="42" height="65" rx="6" fill="url(#bar1)"/>
  <!-- Bar 2: Q2, height=105 -->
  <rect x="163" y="133" width="42" height="105" rx="6" fill="url(#bar2)"/>
  <!-- Bar 3: Q3, height=148 -->
  <rect x="226" y="90" width="42" height="148" rx="6" fill="url(#bar3)"/>
  <!-- Bar 4: Q4, height=188 -->
  <rect x="289" y="50" width="42" height="188" rx="6" fill="url(#bar4)"/>

  <!-- Trend line connecting bar tops -->
  <polyline points="121,173 184,133 247,90 310,50" fill="none" stroke="rgba(251,191,36,0.9)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dots on trend line -->
  <circle cx="121" cy="173" r="5" fill="white" fill-opacity="0.8"/>
  <circle cx="184" cy="133" r="5" fill="white" fill-opacity="0.85"/>
  <circle cx="247" cy="90" r="5" fill="white" fill-opacity="0.9"/>
  <circle cx="310" cy="50" r="6" fill="white"/>

  <!-- Upward arrow at top -->
  <polygon points="310,35 318,54 302,54" fill="white" fill-opacity="0.9"/>

  <!-- X axis labels -->
  <text x="121" y="256" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11" font-family="sans-serif">Q1</text>
  <text x="184" y="256" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11" font-family="sans-serif">Q2</text>
  <text x="247" y="256" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11" font-family="sans-serif">Q3</text>
  <text x="310" y="256" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11" font-family="sans-serif">Q4</text>

  <!-- "+128%" badge -->
  <rect x="270" y="268" width="80" height="24" rx="12" fill="rgba(255,255,255,0.25)"/>
  <text x="310" y="284" text-anchor="middle" fill="white" font-size="12" font-family="sans-serif" font-weight="600">+128% ↑</text>
</svg>
