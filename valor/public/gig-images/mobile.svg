<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.96)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.88)"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Decorative blobs -->
  <circle cx="360" cy="280" r="100" fill="rgba(255,255,255,0.07)"/>
  <circle cx="40" cy="20" r="80" fill="rgba(255,255,255,0.06)"/>

  <!-- Phone shadow -->
  <rect x="142" y="22" width="120" height="262" rx="24" fill="rgba(0,0,0,0.15)"/>
  <!-- Phone body -->
  <rect x="138" y="18" width="120" height="262" rx="24" fill="url(#phone)"/>
  <!-- Phone inner border -->
  <rect x="138" y="18" width="120" height="262" rx="24" fill="none" stroke="rgba(20,184,166,0.2)" stroke-width="1.5"/>
  <!-- Screen -->
  <rect x="148" y="38" width="100" height="196" rx="14" fill="url(#screen)"/>

  <!-- Status bar -->
  <rect x="165" y="44" width="50" height="7" rx="3.5" fill="rgba(255,255,255,0.15)"/>
  <rect x="222" y="44" width="14" height="7" rx="3.5" fill="rgba(255,255,255,0.2)"/>

  <!-- Notch -->
  <rect x="180" y="38" width="36" height="14" rx="7" fill="#1e293b"/>

  <!-- App icons grid (3x3) -->
  <!-- Row 1 -->
  <rect x="162" y="72" width="26" height="26" rx="8" fill="#3b82f6"/>
  <text x="175" y="90" text-anchor="middle" fill="white" font-size="13">📱</text>
  <rect x="197" y="72" width="26" height="26" rx="8" fill="#ec4899"/>
  <text x="210" y="90" text-anchor="middle" fill="white" font-size="13">❤️</text>
  <rect x="232" y="72" width="26" height="26" rx="8" fill="#f59e0b"/>
  <text x="245" y="90" text-anchor="middle" fill="white" font-size="13">⭐</text>
  <!-- Row 2 -->
  <rect x="162" y="108" width="26" height="26" rx="8" fill="#10b981"/>
  <text x="175" y="126" text-anchor="middle" fill="white" font-size="13">💬</text>
  <rect x="197" y="108" width="26" height="26" rx="8" fill="#8b5cf6"/>
  <text x="210" y="126" text-anchor="middle" fill="white" font-size="13">🎵</text>
  <rect x="232" y="108" width="26" height="26" rx="8" fill="#ef4444"/>
  <text x="245" y="126" text-anchor="middle" fill="white" font-size="13">🎮</text>
  <!-- Row 3 -->
  <rect x="162" y="144" width="26" height="26" rx="8" fill="#06b6d4"/>
  <text x="175" y="162" text-anchor="middle" fill="white" font-size="13">🌍</text>
  <rect x="197" y="144" width="26" height="26" rx="8" fill="#f97316"/>
  <text x="210" y="162" text-anchor="middle" fill="white" font-size="13">🛒</text>
  <rect x="232" y="144" width="26" height="26" rx="8" fill="#84cc16"/>
  <text x="245" y="162" text-anchor="middle" fill="white" font-size="13">📸</text>

  <!-- Dock bar -->
  <rect x="160" y="190" width="80" height="36" rx="12" fill="rgba(255,255,255,0.1)"/>
  <rect x="168" y="198" width="20" height="20" rx="6" fill="#3b82f6"/>
  <rect x="196" y="198" width="20" height="20" rx="6" fill="#ec4899"/>
  <rect x="224" y="198" width="20" height="20" rx="6" fill="#10b981"/>

  <!-- Home indicator -->
  <rect x="181" y="232" width="34" height="4" rx="2" fill="rgba(255,255,255,0.3)"/>

  <!-- Side button -->
  <rect x="258" y="78" width="5" height="36" rx="2.5" fill="rgba(20,184,166,0.4)"/>
  <!-- Volume buttons -->
  <rect x="133" y="74" width="5" height="24" rx="2.5" fill="rgba(20,184,166,0.4)"/>
  <rect x="133" y="106" width="5" height="24" rx="2.5" fill="rgba(20,184,166,0.4)"/>

  <!-- Flutter logo hint on the side -->
  <text x="72" y="158" fill="rgba(255,255,255,0.6)" font-size="11" font-family="sans-serif" font-weight="500">Flutter</text>
  <text x="302" y="158" fill="rgba(255,255,255,0.6)" font-size="11" font-family="sans-serif" font-weight="500">iOS &amp; Android</text>
</svg>
