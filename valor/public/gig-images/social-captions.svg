<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="50" cy="50" r="80" fill="rgba(255,255,255,0.06)"/>
  <circle cx="370" cy="260" r="90" fill="rgba(255,255,255,0.05)"/>
  <!-- Chat bubble 1 (large, left) -->
  <rect x="50" y="55" width="190" height="90" rx="16" fill="white" fill-opacity="0.95"/>
  <polygon points="70,145 90,145 75,162" fill="white" fill-opacity="0.95"/>
  <rect x="64" y="72" width="100" height="7" rx="3.5" fill="#14b8a6" fill-opacity="0.8"/>
  <rect x="64" y="86" width="155" height="6" rx="3" fill="#374151" fill-opacity="0.25"/>
  <rect x="64" y="98" width="140" height="6" rx="3" fill="#374151" fill-opacity="0.25"/>
  <rect x="64" y="110" width="120" height="6" rx="3" fill="#374151" fill-opacity="0.25"/>
  <!-- Hashtags in bubble 1 -->
  <rect x="64" y="122" width="42" height="14" rx="7" fill="#14b8a6" fill-opacity="0.15"/>
  <rect x="112" y="122" width="50" height="14" rx="7" fill="#14b8a6" fill-opacity="0.15"/>
  <text x="71" y="133" font-size="9" fill="#0d9488" font-weight="600">#design</text>
  <text x="119" y="133" font-size="9" fill="#0d9488" font-weight="600">#branding</text>
  <!-- Chat bubble 2 (right) -->
  <rect x="165" y="168" width="185" height="80" rx="16" fill="white" fill-opacity="0.85"/>
  <polygon points="330,248 350,248 340,265" fill="white" fill-opacity="0.85"/>
  <rect x="180" y="183" width="90" height="7" rx="3.5" fill="#0d9488" fill-opacity="0.8"/>
  <rect x="180" y="197" width="155" height="6" rx="3" fill="#374151" fill-opacity="0.2"/>
  <rect x="180" y="209" width="130" height="6" rx="3" fill="#374151" fill-opacity="0.2"/>
  <!-- Hashtags in bubble 2 -->
  <rect x="180" y="223" width="55" height="14" rx="7" fill="#0d9488" fill-opacity="0.15"/>
  <rect x="241" y="223" width="46" height="14" rx="7" fill="#0d9488" fill-opacity="0.15"/>
  <text x="187" y="234" font-size="9" fill="#065f46" font-weight="600">#trending</text>
  <text x="248" y="234" font-size="9" fill="#065f46" font-weight="600">#viral</text>
  <!-- Floating emoji -->
  <text x="68" y="188" font-size="24" fill="white" fill-opacity="0.9">✍️</text>
