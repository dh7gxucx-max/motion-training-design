<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="ig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f09433"/>
      <stop offset="33%" stop-color="#e6683c"/>
      <stop offset="66%" stop-color="#dc2743"/>
      <stop offset="100%" stop-color="#cc2366"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="50" cy="50" r="80" fill="rgba(255,255,255,0.06)"/>
  <circle cx="370" cy="260" r="90" fill="rgba(255,255,255,0.05)"/>
  <!-- Phone outline -->
  <rect x="125" y="25" width="150" height="250" rx="22" fill="#1a1a2e" fill-opacity="0.8"/>
  <rect x="128" y="28" width="144" height="244" rx="20" fill="#111827" fill-opacity="0.9"/>
  <!-- Notch -->
  <rect x="170" y="28" width="60" height="12" rx="6" fill="#1a1a2e" fill-opacity="0.8"/>
  <!-- IG header in phone -->
  <rect x="128" y="48" width="144" height="28" fill="#111827"/>
  <rect x="128" y="48" width="144" height="1" fill="white" fill-opacity="0.1"/>
  <text x="160" y="66" font-size="13" font-weight="700" fill="white" font-family="sans-serif">valor_studio</text>
  <!-- IG icon -->
  <rect x="136" y="54" width="18" height="18" rx="5" fill="url(#ig)"/>
  <rect x="136" y="54" width="18" height="18" rx="5" fill="none" stroke="white" stroke-width="1.5"/>
  <circle cx="145" cy="63" r="4" fill="none" stroke="white" stroke-width="1.5"/>
  <circle cx="151" cy="56" r="1.5" fill="white"/>
  <!-- Stories row -->
  <rect x="128" y="76" width="144" height="52" fill="#1a1a1a"/>
  <circle cx="148" cy="102" r="18" fill="none" stroke="url(#ig)" stroke-width="2"/>
  <circle cx="148" cy="102" r="14" fill="#2d2d5e"/>
  <circle cx="178" cy="102" r="18" fill="none" stroke="url(#ig)" stroke-width="2"/>
  <circle cx="178" cy="102" r="14" fill="#2d2d5e"/>
  <circle cx="208" cy="102" r="18" fill="none" stroke="url(#ig)" stroke-width="2"/>
  <circle cx="208" cy="102" r="14" fill="#2d2d5e"/>
  <circle cx="238" cy="102" r="18" fill="none" stroke="#374151" stroke-width="2"/>
  <circle cx="238" cy="102" r="14" fill="#2d2d5e"/>
  <!-- Photo grid 3x3 -->
  <rect x="128" y="130" width="46" height="44" fill="#ec4899" fill-opacity="0.6"/>
  <rect x="176" y="130" width="46" height="44" fill="#f97316" fill-opacity="0.6"/>
  <rect x="224" y="130" width="48" height="44" fill="#8b5cf6" fill-opacity="0.6"/>
  <rect x="128" y="176" width="46" height="44" fill="#3b82f6" fill-opacity="0.6"/>
  <rect x="176" y="176" width="46" height="44" fill="#10b981" fill-opacity="0.6"/>
  <rect x="224" y="176" width="48" height="44" fill="#f43f5e" fill-opacity="0.6"/>
  <rect x="128" y="222" width="46" height="40" fill="#eab308" fill-opacity="0.6"/>
  <rect x="176" y="222" width="46" height="40" fill="#ec4899" fill-opacity="0.6"/>
  <rect x="224" y="222" width="48" height="40" fill="#06b6d4" fill-opacity="0.6"/>
  <!-- Grid lines -->
  <line x1="174" y1="130" x2="174" y2="262" stroke="#111827" stroke-width="2"/>
  <line x1="222" y1="130" x2="222" y2="262" stroke="#111827" stroke-width="2"/>
  <line x1="128" y1="174" x2="272" y2="174" stroke="#111827" stroke-width="2"/>
  <line x1="128" y1="220" x2="272" y2="220" stroke="#111827" stroke-width="2"/>
</svg>
