<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="360" cy="260" r="100" fill="rgba(255,255,255,0.06)"/>
  <circle cx="30" cy="30" r="80" fill="rgba(255,255,255,0.05)"/>
  <!-- Notebook shadow -->
  <rect x="108" y="48" width="184" height="210" rx="10" fill="#065f46" fill-opacity="0.4"/>
  <!-- Notebook -->
  <rect x="100" y="42" width="184" height="210" rx="10" fill="white" fill-opacity="0.95"/>
  <!-- Spine -->
  <rect x="100" y="42" width="22" height="210" rx="10" fill="#10b981" fill-opacity="0.7"/>
  <rect x="111" y="42" width="11" height="210" fill="#10b981" fill-opacity="0.7"/>
  <!-- Binding rings -->
  <circle cx="111" cy="80" r="8" fill="none" stroke="#065f46" stroke-width="3" stroke-opacity="0.5"/>
  <circle cx="111" cy="110" r="8" fill="none" stroke="#065f46" stroke-width="3" stroke-opacity="0.5"/>
  <circle cx="111" cy="140" r="8" fill="none" stroke="#065f46" stroke-width="3" stroke-opacity="0.5"/>
  <circle cx="111" cy="170" r="8" fill="none" stroke="#065f46" stroke-width="3" stroke-opacity="0.5"/>
  <circle cx="111" cy="200" r="8" fill="none" stroke="#065f46" stroke-width="3" stroke-opacity="0.5"/>
  <circle cx="111" cy="230" r="8" fill="none" stroke="#065f46" stroke-width="3" stroke-opacity="0.5"/>
  <!-- Text lines -->
  <rect x="132" y="65" width="136" height="9" rx="4" fill="#10b981" fill-opacity="0.4"/>
  <rect x="132" y="82" width="136" height="6" rx="3" fill="#374151" fill-opacity="0.2"/>
  <rect x="132" y="94" width="110" height="6" rx="3" fill="#374151" fill-opacity="0.2"/>
  <rect x="132" y="106" width="125" height="6" rx="3" fill="#374151" fill-opacity="0.2"/>
  <rect x="132" y="118" width="100" height="6" rx="3" fill="#374151" fill-opacity="0.2"/>
  <rect x="132" y="135" width="136" height="8" rx="4" fill="#10b981" fill-opacity="0.3"/>
  <rect x="132" y="150" width="130" height="5" rx="2.5" fill="#374151" fill-opacity="0.15"/>
  <rect x="132" y="161" width="118" height="5" rx="2.5" fill="#374151" fill-opacity="0.15"/>
  <rect x="132" y="172" width="125" height="5" rx="2.5" fill="#374151" fill-opacity="0.15"/>
  <rect x="132" y="183" width="90" height="5" rx="2.5" fill="#374151" fill-opacity="0.15"/>
  <!-- Pen -->
  <g transform="rotate(30, 290, 220)">
    <rect x="278" y="150" width="12" height="75" rx="6" fill="#f59e0b"/>
    <rect x="281" y="155" width="3" height="60" rx="1.5" fill="rgba(255,255,255,0.3)"/>
    <polygon points="278,223 290,223 284,242" fill="#92400e"/>
    <rect x="278" y="219" width="12" height="6" fill="#78716c"/>
  </g>
</svg>
