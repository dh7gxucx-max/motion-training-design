<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="360" cy="40" r="80" fill="rgba(255,255,255,0.07)"/>
  <circle cx="40" cy="270" r="90" fill="rgba(255,255,255,0.05)"/>
  <!-- Product box -->
  <rect x="65" y="75" width="120" height="150" rx="8" fill="white" fill-opacity="0.2"/>
  <rect x="70" y="80" width="110" height="140" rx="6" fill="white" fill-opacity="0.85"/>
  <!-- Product image placeholder -->
  <rect x="78" y="88" width="94" height="80" rx="4" fill="#dcfce7"/>
  <circle cx="125" cy="128" r="26" fill="#22c55e" fill-opacity="0.4"/>
  <circle cx="125" cy="128" r="16" fill="#22c55e" fill-opacity="0.6"/>
  <!-- Star rating -->
  <text x="84" y="185" font-size="11" fill="#f59e0b">★★★★★</text>
  <rect x="78" y="192" width="85" height="6" rx="3" fill="#374151" fill-opacity="0.4"/>
  <rect x="78" y="204" width="65" height="6" rx="3" fill="#374151" fill-opacity="0.3"/>
  <rect x="78" y="213" width="50" height="8" rx="4" fill="#16a34a" fill-opacity="0.8"/>
  <!-- Price tag -->
  <g transform="translate(195,80)">
    <rect x="0" y="0" width="130" height="170" rx="8" fill="white" fill-opacity="0.9"/>
    <circle cx="15" cy="15" r="8" fill="#84cc16" fill-opacity="0.8"/>
    <line x1="0" y1="15" x2="10" y2="15" stroke="#84cc16" stroke-width="2"/>
    <!-- Tag lines -->
    <rect x="12" y="32" width="106" height="8" rx="4" fill="#15803d" fill-opacity="0.5"/>
    <rect x="12" y="48" width="90" height="6" rx="3" fill="#374151" fill-opacity="0.25"/>
    <rect x="12" y="60" width="100" height="6" rx="3" fill="#374151" fill-opacity="0.25"/>
    <rect x="12" y="72" width="80" height="6" rx="3" fill="#374151" fill-opacity="0.25"/>
    <rect x="12" y="84" width="95" height="6" rx="3" fill="#374151" fill-opacity="0.25"/>
    <rect x="12" y="96" width="70" height="6" rx="3" fill="#374151" fill-opacity="0.25"/>
    <!-- Price -->
    <rect x="12" y="116" width="106" height="1" fill="#e5e7eb"/>
    <rect x="12" y="128" width="55" height="10" rx="5" fill="#84cc16"/>
    <rect x="75" y="128" width="43" height="10" rx="5" fill="#374151" fill-opacity="0.1"/>
    <rect x="12" y="146" width="106" height="14" rx="7" fill="#15803d"/>
  </g>
</svg>
