  <rect x="233" y="248" width="114" height="14" fill="#0f172a"/>
  <polygon points="258,254 265,248 272,254" fill="white" fill-opacity="0.35"/>
  <rect x="284" y="250" width="10" height="6" rx="3" fill="none" stroke="white" stroke-width="1.2" stroke-opacity="0.35"/>
  <polygon points="310,248 318,255 310,262 310,248" fill="none" stroke="white" stroke-width="1.2" stroke-opacity="0.35"/>
  <!-- Android app content -->
  <rect x="240" y="56" width="100" height="32" fill="#06b6d4" fill-opacity="0.7"/>
  <rect x="247" y="65" width="50" height="8" rx="4" fill="white" fill-opacity="0.8"/>
  <circle cx="326" cy="70" r="8" fill="white" fill-opacity="0.15"/>
  <!-- FAB -->
  <circle cx="316" cy="225" r="16" fill="#06b6d4"/>
  <text x="316" y="231" text-anchor="middle" font-size="18" fill="white" font-weight="300">+</text>
  <!-- Material cards -->
  <rect x="240" y="95" width="100" height="55" rx="6" fill="white" fill-opacity="0.07"/>
  <rect x="240" y="95" width="100" height="55" rx="6" fill="none" stroke="white" stroke-width="0.5" stroke-opacity="0.2"/>
  <rect x="247" y="103" width="50" height="7" rx="3.5" fill="white" fill-opacity="0.5"/>
  <rect x="247" y="115" width="85" height="5" rx="2.5" fill="white" fill-opacity="0.3"/>
  <rect x="247" y="125" width="70" height="5" rx="2.5" fill="white" fill-opacity="0.3"/>
  <rect x="247" y="135" width="50" height="5" rx="2.5" fill="white" fill-opacity="0.3"/>
  <rect x="240" y="156" width="100" height="55" rx="6" fill="white" fill-opacity="0.07"/>
  <rect x="247" y="164" width="50" height="7" rx="3.5" fill="white" fill-opacity="0.5"/>
  <rect x="247" y="176" width="85" height="5" rx="2.5" fill="white" fill-opacity="0.3"/>
  <rect x="247" y="186" width="60" height="5" rx="2.5" fill="white" fill-opacity="0.3"/>
  <!-- React Native atom between phones -->
  <g transform="translate(200,150)">
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.6" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.6" transform="rotate(120)"/>
    <circle cx="0" cy="0" r="4" fill="white" fill-opacity="0.9"/>
  </g>
