<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="50" cy="50" r="70" fill="rgba(255,255,255,0.06)"/>
  <circle cx="360" cy="260" r="90" fill="rgba(255,255,255,0.05)"/>
  <!-- iOS Phone (left) -->
  <rect x="50" y="35" width="120" height="230" rx="20" fill="#1e293b" fill-opacity="0.9"/>
  <rect x="53" y="38" width="114" height="224" rx="18" fill="#0f172a"/>
  <rect x="88" y="38" width="40" height="10" rx="5" fill="#1e293b"/>
  <!-- iOS home indicator -->
  <rect x="93" y="252" width="34" height="4" rx="2" fill="white" fill-opacity="0.4"/>
  <!-- iOS status bar -->
  <rect x="60" y="52" width="40" height="6" rx="3" fill="white" fill-opacity="0.4"/>
  <rect x="143" y="52" width="18" height="6" rx="3" fill="white" fill-opacity="0.4"/>
  <!-- iOS app content -->
  <rect x="60" y="68" width="100" height="30" fill="#06b6d4" fill-opacity="0.7"/>
  <rect x="67" y="76" width="50" height="8" rx="4" fill="white" fill-opacity="0.8"/>
  <rect x="60" y="102" width="100" height="55" rx="4" fill="white" fill-opacity="0.06"/>
  <rect x="67" y="110" width="40" height="6" rx="3" fill="white" fill-opacity="0.5"/>
  <rect x="67" y="121" width="85" height="5" rx="2.5" fill="white" fill-opacity="0.3"/>
  <rect x="67" y="130" width="70" height="5" rx="2.5" fill="white" fill-opacity="0.3"/>
  <rect x="67" y="141" width="80" height="5" rx="2.5" fill="white" fill-opacity="0.3"/>
  <rect x="60" y="162" width="46" height="46" rx="8" fill="#06b6d4" fill-opacity="0.25"/>
  <rect x="112" y="162" width="46" height="46" rx="8" fill="#14b8a6" fill-opacity="0.25"/>
  <rect x="60" y="212" width="100" height="28" rx="6" fill="#06b6d4" fill-opacity="0.5"/>
  <rect x="75" y="222" width="68" height="8" rx="4" fill="white" fill-opacity="0.8"/>
  <!-- Android Phone (right) -->
  <rect x="230" y="35" width="120" height="230" rx="16" fill="#1e293b" fill-opacity="0.9"/>
  <rect x="233" y="38" width="114" height="224" rx="14" fill="#0f172a"/>
