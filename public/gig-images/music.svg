<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Decorative blobs -->
  <circle cx="30" cy="30" r="90" fill="rgba(255,255,255,0.07)"/>
  <circle cx="370" cy="270" r="100" fill="rgba(255,255,255,0.06)"/>

  <!-- Sound waves (background) -->
  <ellipse cx="200" cy="148" rx="140" ry="120" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <ellipse cx="200" cy="148" rx="110" ry="92" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- Headphone headband (arc) -->
  <path d="M 112,152 A 90,90 0 0 1 288,152" fill="none" stroke="white" stroke-width="18" stroke-linecap="round" fill-opacity="0" stroke-opacity="0.92"/>
  <!-- Headband inner highlight -->
  <path d="M 112,152 A 90,90 0 0 1 288,152" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="6" stroke-linecap="round"/>

  <!-- Left ear cup -->
  <ellipse cx="110" cy="170" rx="32" ry="40" fill="white" fill-opacity="0.9"/>
  <ellipse cx="110" cy="170" rx="22" ry="30" fill="rgba(239,68,68,0.25)"/>
  <ellipse cx="110" cy="170" rx="32" ry="40" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <!-- Left cup cushion -->
  <ellipse cx="110" cy="170" rx="26" ry="34" fill="none" stroke="rgba(239,68,68,0.3)" stroke-width="8"/>

  <!-- Right ear cup -->
  <ellipse cx="290" cy="170" rx="32" ry="40" fill="white" fill-opacity="0.9"/>
  <ellipse cx="290" cy="170" rx="22" ry="30" fill="rgba(239,68,68,0.25)"/>
  <ellipse cx="290" cy="170" rx="32" ry="40" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <!-- Right cup cushion -->
  <ellipse cx="290" cy="170" rx="26" ry="34" fill="none" stroke="rgba(239,68,68,0.3)" stroke-width="8"/>

  <!-- Musical notes floating -->
  <!-- Note 1 (large, upper left) -->
  <g transform="translate(72, 60) rotate(-15)">
    <ellipse cx="0" cy="0" rx="9" ry="7" fill="white" fill-opacity="0.82"/>
    <line x1="9" y1="0" x2="9" y2="-32" stroke="white" stroke-width="3" stroke-opacity="0.82" stroke-linecap="round"/>
    <line x1="9" y1="-32" x2="26" y2="-26" stroke="white" stroke-width="3" stroke-opacity="0.82" stroke-linecap="round"/>
  </g>
  <!-- Note 2 (medium, upper right) -->
  <g transform="translate(310, 48) rotate(10)">
    <ellipse cx="0" cy="0" rx="7" ry="6" fill="white" fill-opacity="0.7"/>
    <line x1="7" y1="0" x2="7" y2="-26" stroke="white" stroke-width="2.5" stroke-opacity="0.7" stroke-linecap="round"/>
    <line x1="7" y1="-26" x2="22" y2="-21" stroke="white" stroke-width="2.5" stroke-opacity="0.7" stroke-linecap="round"/>
  </g>
  <!-- Note 3 (small, right middle) -->
  <g transform="translate(346, 118) rotate(5)">
    <ellipse cx="0" cy="0" rx="6" ry="5" fill="white" fill-opacity="0.55"/>
    <line x1="6" y1="0" x2="6" y2="-20" stroke="white" stroke-width="2" stroke-opacity="0.55" stroke-linecap="round"/>
    <line x1="6" y1="-20" x2="18" y2="-16" stroke="white" stroke-width="2" stroke-opacity="0.55" stroke-linecap="round"/>
  </g>
  <!-- Double note (two joined, center top) -->
  <g transform="translate(175, 40) rotate(-5)">
    <ellipse cx="0" cy="0" rx="7" ry="6" fill="white" fill-opacity="0.65"/>
    <ellipse cx="18" cy="-4" rx="7" ry="6" fill="white" fill-opacity="0.65"/>
    <line x1="7" y1="-1" x2="7" y2="-28" stroke="white" stroke-width="2.5" stroke-opacity="0.65" stroke-linecap="round"/>
    <line x1="25" y1="-5" x2="25" y2="-32" stroke="white" stroke-width="2.5" stroke-opacity="0.65" stroke-linecap="round"/>
    <line x1="7" y1="-28" x2="25" y2="-32" stroke="white" stroke-width="2.5" stroke-opacity="0.65"/>
  </g>

  <!-- Wire from ear cups to jack at bottom -->
  <path d="M 110,210 Q 110,255 200,260 Q 290,255 290,210" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="3" stroke-linecap="round"/>
  <!-- Jack plug -->
  <line x1="200" y1="260" x2="200" y2="282" stroke="rgba(255,255,255,0.5)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="200" cy="285" r="5" fill="rgba(255,255,255,0.5)"/>
</svg>
