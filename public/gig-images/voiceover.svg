<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="40" cy="260" r="90" fill="rgba(255,255,255,0.06)"/>
  <circle cx="370" cy="40" r="70" fill="rgba(255,255,255,0.05)"/>
  <!-- Mic stand base -->
  <rect x="186" y="248" width="28" height="8" rx="4" fill="white" fill-opacity="0.6"/>
  <rect x="155" y="252" width="90" height="10" rx="5" fill="white" fill-opacity="0.4"/>
  <!-- Mic stand pole -->
  <rect x="197" y="175" width="6" height="76" rx="3" fill="white" fill-opacity="0.5"/>
  <!-- Mic arm -->
  <rect x="157" y="123" width="6" height="56" rx="3" fill="white" fill-opacity="0.5"/>
  <rect x="157" y="123" width="46" height="6" rx="3" fill="white" fill-opacity="0.5"/>
  <!-- Studio mic body -->
  <rect x="140" y="55" width="42" height="80" rx="21" fill="white" fill-opacity="0.15"/>
  <rect x="143" y="58" width="36" height="74" rx="18" fill="white" fill-opacity="0.9"/>
  <!-- Mic grille lines -->
  <rect x="149" y="68" width="24" height="2" rx="1" fill="#ec4899" fill-opacity="0.4"/>
  <rect x="149" y="74" width="24" height="2" rx="1" fill="#ec4899" fill-opacity="0.4"/>
  <rect x="149" y="80" width="24" height="2" rx="1" fill="#ec4899" fill-opacity="0.4"/>
  <rect x="149" y="86" width="24" height="2" rx="1" fill="#ec4899" fill-opacity="0.4"/>
  <rect x="149" y="92" width="24" height="2" rx="1" fill="#ec4899" fill-opacity="0.4"/>
  <rect x="149" y="98" width="24" height="2" rx="1" fill="#ec4899" fill-opacity="0.4"/>
  <rect x="149" y="104" width="24" height="2" rx="1" fill="#ec4899" fill-opacity="0.4"/>
  <rect x="149" y="110" width="24" height="2" rx="1" fill="#ec4899" fill-opacity="0.4"/>
  <!-- Mic label -->
  <rect x="147" y="118" width="28" height="10" rx="3" fill="#ec4899" fill-opacity="0.2"/>
  <!-- Sound waves (right) -->
  <ellipse cx="216" cy="95" rx="12" ry="22" fill="none" stroke="white" stroke-width="2.5" stroke-opacity="0.6"/>
  <ellipse cx="234" cy="95" rx="22" ry="38" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.4"/>
  <ellipse cx="256" cy="95" rx="36" ry="58" fill="none" stroke="white" stroke-width="1.5" stroke-opacity="0.25"/>
  <!-- Record button (on/off indicator) -->
  <circle cx="200" cy="210" r="20" fill="white" fill-opacity="0.15"/>
  <circle cx="200" cy="210" r="14" fill="#ef4444"/>
  <circle cx="200" cy="210" r="8" fill="#ff6b6b"/>
  <!-- Audio level bars bottom -->
  <rect x="265" y="180" width="8" height="20" rx="4" fill="white" fill-opacity="0.3"/>
  <rect x="278" y="168" width="8" height="32" rx="4" fill="white" fill-opacity="0.45"/>
  <rect x="291" y="155" width="8" height="45" rx="4" fill="white" fill-opacity="0.6"/>
  <rect x="304" y="168" width="8" height="32" rx="4" fill="white" fill-opacity="0.45"/>
  <rect x="317" y="178" width="8" height="22" rx="4" fill="white" fill-opacity="0.3"/>
  <rect x="330" y="185" width="8" height="15" rx="4" fill="white" fill-opacity="0.2"/>
</svg>
