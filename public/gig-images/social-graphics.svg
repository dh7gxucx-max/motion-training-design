<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="360" cy="30" r="80" fill="rgba(255,255,255,0.06)"/>
  <circle cx="30" cy="270" r="90" fill="rgba(255,255,255,0.05)"/>
  <!-- Phone frame -->
  <rect x="130" y="30" width="140" height="240" rx="18" fill="white" fill-opacity="0.15"/>
  <rect x="133" y="33" width="134" height="234" rx="16" fill="#1e1b4b" fill-opacity="0.6"/>
  <!-- Status bar -->
  <rect x="155" y="38" width="50" height="8" rx="4" fill="white" fill-opacity="0.3"/>
  <!-- IG header -->
  <rect x="133" y="52" width="134" height="28" rx="0" fill="white" fill-opacity="0.1"/>
  <circle cx="152" cy="66" r="10" fill="rgba(255,255,255,0.6)"/>
  <rect x="168" y="62" width="40" height="5" rx="2.5" fill="white" fill-opacity="0.7"/>
  <rect x="168" y="70" width="28" height="4" rx="2" fill="white" fill-opacity="0.4"/>
  <!-- Post image -->
  <rect x="133" y="80" width="134" height="120" fill="url(#bg)" fill-opacity="0.8"/>
  <polygon points="200,110 220,140 180,140" fill="white" fill-opacity="0.5"/>
  <circle cx="200" cy="125" r="18" fill="white" fill-opacity="0.15"/>
  <rect x="183" y="162" width="5" height="5" rx="1" fill="white" fill-opacity="0.8"/>
  <rect x="191" y="162" width="5" height="5" rx="1" fill="white" fill-opacity="0.4"/>
  <rect x="199" y="162" width="5" height="5" rx="1" fill="white" fill-opacity="0.4"/>
  <!-- Like/comment bar -->
  <rect x="133" y="200" width="134" height="30" fill="white" fill-opacity="0.08"/>
  <circle cx="150" cy="215" r="8" fill="#f43f5e" fill-opacity="0.8"/>
  <rect x="163" y="211" width="30" height="5" rx="2.5" fill="white" fill-opacity="0.4"/>
  <rect x="200" y="211" width="20" height="5" rx="2.5" fill="white" fill-opacity="0.4"/>
  <!-- Caption lines -->
  <rect x="140" y="236" width="100" height="5" rx="2.5" fill="white" fill-opacity="0.5"/>
  <rect x="140" y="246" width="75" height="4" rx="2" fill="white" fill-opacity="0.3"/>
  <!-- Stars/sparkles outside -->
  <text x="85" y="100" font-size="22" fill="white" fill-opacity="0.7">✦</text>
  <text x="305" y="180" font-size="16" fill="white" fill-opacity="0.5">✦</text>
  <text x="310" y="90" font-size="12" fill="white" fill-opacity="0.4">✦</text>
</svg>
