<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="350" cy="270" r="100" fill="rgba(255,255,255,0.06)"/>
  <circle cx="40" cy="40" r="70" fill="rgba(255,255,255,0.05)"/>
  <!-- Browser shell -->
  <rect x="55" y="45" width="290" height="210" rx="10" fill="white" fill-opacity="0.12"/>
  <rect x="55" y="45" width="290" height="28" rx="10" fill="white" fill-opacity="0.22"/>
  <rect x="55" y="61" width="290" height="12" fill="white" fill-opacity="0.22"/>
  <circle cx="73" cy="59" r="5" fill="#f43f5e" fill-opacity="0.9"/>
  <circle cx="88" cy="59" r="5" fill="#eab308" fill-opacity="0.9"/>
  <circle cx="103" cy="59" r="5" fill="#22c55e" fill-opacity="0.9"/>
  <rect x="118" y="52" width="165" height="14" rx="7" fill="white" fill-opacity="0.2"/>
  <!-- WordPress logo (W mark) -->
  <circle cx="200" cy="145" r="55" fill="white" fill-opacity="0.12"/>
  <circle cx="200" cy="145" r="55" fill="none" stroke="white" stroke-width="2.5" stroke-opacity="0.5"/>
  <text x="200" y="160" text-anchor="middle" font-size="44" font-weight="900" fill="white" fill-opacity="0.9" font-family="Georgia,serif">W</text>
  <!-- Blog post lines -->
  <rect x="75" y="85" width="110" height="8" rx="4" fill="white" fill-opacity="0.5"/>
  <rect x="75" y="99" width="80" height="6" rx="3" fill="white" fill-opacity="0.3"/>
  <rect x="75" y="220" width="250" height="6" rx="3" fill="white" fill-opacity="0.3"/>
  <rect x="75" y="233" width="200" height="6" rx="3" fill="white" fill-opacity="0.2"/>
  <rect x="75" y="246" width="225" height="6" rx="3" fill="white" fill-opacity="0.25"/>
</svg>
