  <rect x="132" y="63" width="60" height="6" rx="3" fill="white" fill-opacity="0.5"/>
  <!-- Code content -->
  <rect x="75" y="92" width="60" height="7" rx="3" fill="#61dafb" fill-opacity="0.8"/>
