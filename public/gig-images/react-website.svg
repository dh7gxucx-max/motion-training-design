  <rect x="75" y="131" width="30" height="6" rx="3" fill="white" fill-opacity="0.3"/>
  <rect x="75" y="144" width="50" height="6" rx="3" fill="#61dafb" fill-opacity="0.6"/>
  <rect x="75" y="157" width="35" height="6" rx="3" fill="white" fill-opacity="0.3"/>
  <!-- React atom icon right side -->
  <g transform="translate(270,155)">
