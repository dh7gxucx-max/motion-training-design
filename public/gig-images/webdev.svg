<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.97)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.90)"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Decorative blobs -->
  <circle cx="20" cy="20" r="80" fill="rgba(255,255,255,0.07)"/>
  <circle cx="380" cy="280" r="100" fill="rgba(255,255,255,0.06)"/>

  <!-- Browser window shadow -->
  <rect x="58" y="52" width="290" height="205" rx="16" fill="rgba(0,0,0,0.15)"/>
  <!-- Browser window -->
  <rect x="55" y="48" width="290" height="205" rx="16" fill="url(#card)"/>
  <!-- Title bar -->
  <rect x="55" y="48" width="290" height="46" rx="16" fill="rgba(30,64,175,0.08)"/>
  <rect x="55" y="76" width="290" height="18" fill="rgba(30,64,175,0.08)"/>

  <!-- Window control dots -->
  <circle cx="85" cy="71" r="8" fill="#ef4444" fill-opacity="0.75"/>
  <circle cx="108" cy="71" r="8" fill="#f59e0b" fill-opacity="0.75"/>
  <circle cx="131" cy="71" r="8" fill="#10b981" fill-opacity="0.75"/>

  <!-- URL bar -->
  <rect x="152" y="61" width="162" height="20" rx="10" fill="rgba(255,255,255,0.5)" stroke="rgba(59,130,246,0.2)" stroke-width="1"/>
  <text x="233" y="75" text-anchor="middle" fill="rgba(59,130,246,0.5)" font-size="9" font-family="monospace">valor.in/services</text>

  <!-- Code content area -->
  <!-- Big code bracket symbol -->
  <text x="200" y="175" text-anchor="middle" fill="rgba(59,130,246,0.18)" font-size="88" font-family="monospace" font-weight="700">&lt;/&gt;</text>
  <!-- Code lines -->
  <rect x="88" y="200" width="115" height="7" rx="3.5" fill="rgba(59,130,246,0.15)"/>
  <rect x="88" y="215" width="78" height="7" rx="3.5" fill="rgba(59,130,246,0.12)"/>
  <rect x="215" y="200" width="92" height="7" rx="3.5" fill="rgba(6,182,212,0.18)"/>
  <rect x="215" y="215" width="55" height="7" rx="3.5" fill="rgba(6,182,212,0.12)"/>

  <!-- Floating code tag decorations -->
  <rect x="58" y="268" width="80" height="22" rx="11" fill="rgba(59,130,246,0.2)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="98" y="283" text-anchor="middle" fill="rgba(59,130,246,0.7)" font-size="10" font-family="monospace">React</text>
  <rect x="150" y="268" width="80" height="22" rx="11" fill="rgba(6,182,212,0.2)" stroke="rgba(6,182,212,0.3)" stroke-width="1"/>
  <text x="190" y="283" text-anchor="middle" fill="rgba(6,182,212,0.7)" font-size="10" font-family="monospace">Next.js</text>
  <rect x="242" y="268" width="80" height="22" rx="11" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.25)" stroke-width="1"/>
  <text x="282" y="283" text-anchor="middle" fill="rgba(59,130,246,0.7)" font-size="10" font-family="monospace">TypeScript</text>
</svg>
