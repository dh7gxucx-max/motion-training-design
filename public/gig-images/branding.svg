<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="diamond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.95)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.75)"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Decorative blobs -->
  <circle cx="360" cy="270" r="110" fill="rgba(255,255,255,0.07)"/>
  <circle cx="30" cy="30" r="80" fill="rgba(255,255,255,0.06)"/>

  <!-- Outer ring -->
  <circle cx="200" cy="138" r="100" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <!-- Inner ring -->
  <circle cx="200" cy="138" r="78" fill="rgba(255,255,255,0.08)"/>

  <!-- Diamond/gem shape centered -->
  <!-- Top facet (crown) -->
  <polygon points="200,60 240,100 200,95 160,100" fill="url(#diamond)"/>
  <!-- Top-left facet -->
  <polygon points="160,100 200,95 180,148" fill="rgba(255,255,255,0.82)"/>
  <!-- Top-right facet -->
  <polygon points="240,100 220,148 200,95" fill="rgba(255,255,255,0.7)"/>
  <!-- Center facet -->
  <polygon points="200,95 220,148 200,160 180,148" fill="rgba(255,255,255,0.9)"/>
  <!-- Left facet -->
  <polygon points="160,100 180,148 148,152" fill="rgba(255,255,255,0.6)"/>
  <!-- Right facet -->
  <polygon points="240,100 252,152 220,148" fill="rgba(255,255,255,0.55)"/>
  <!-- Bottom-left facet -->
  <polygon points="148,152 180,148 200,210" fill="rgba(255,255,255,0.72)"/>
  <!-- Bottom-right facet -->
  <polygon points="252,152 200,210 220,148" fill="rgba(255,255,255,0.62)"/>
  <!-- Bottom tip -->
  <polygon points="180,148 220,148 200,210" fill="rgba(255,255,255,0.5)"/>
  <!-- Diamond outline for clarity -->
  <polygon points="200,60 240,100 252,152 200,210 148,152 160,100" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>

  <!-- Stars / sparkles -->
  <!-- Star 1 (big, top-left) -->
  <g transform="translate(78, 72)">
    <polygon points="0,-14 3,-5 12,-5 5,1 8,10 0,4 -8,10 -5,1 -12,-5 -3,-5" fill="white" fill-opacity="0.85"/>
  </g>
  <!-- Star 2 (small, top-right) -->
  <g transform="translate(328, 60)">
    <polygon points="0,-9 2,-3 8,-3 3,1 5,7 0,3 -5,7 -3,1 -8,-3 -2,-3" fill="white" fill-opacity="0.7"/>
  </g>
  <!-- Star 3 (tiny, right) -->
  <g transform="translate(348, 140)">
    <polygon points="0,-6 1.5,-2 6,-2 2.5,1 3.5,5 0,2.5 -3.5,5 -2.5,1 -6,-2 -1.5,-2" fill="white" fill-opacity="0.6"/>
  </g>
  <!-- Star 4 (small, left) -->
  <g transform="translate(54, 165)">
    <polygon points="0,-8 2,-3 7,-3 3,1 4,6 0,3 -4,6 -3,1 -7,-3 -2,-3" fill="white" fill-opacity="0.65"/>
  </g>

  <!-- Color palette swatches at the bottom -->
  <rect x="100" y="240" width="200" height="36" rx="18" fill="rgba(0,0,0,0.2)"/>
  <circle cx="130" cy="258" r="12" fill="#f43f5e"/>
  <circle cx="160" cy="258" r="12" fill="#f97316"/>
  <circle cx="190" cy="258" r="12" fill="#eab308"/>
  <circle cx="220" cy="258" r="12" fill="#10b981"/>
  <circle cx="250" cy="258" r="12" fill="#3b82f6"/>
  <circle cx="280" cy="258" r="12" fill="#a855f7"/>
  <!-- White border on swatches -->
  <circle cx="130" cy="258" r="12" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <circle cx="160" cy="258" r="12" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <circle cx="190" cy="258" r="12" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <circle cx="220" cy="258" r="12" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <circle cx="250" cy="258" r="12" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <circle cx="280" cy="258" r="12" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
</svg>
